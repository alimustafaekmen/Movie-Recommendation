# Security updates only: the project is not updated on a schedule. A limit of 0 turns off
# version updates, and Dependabot opens a pull request only for a security advisory, one per
# ecosystem. If CI fails on it (usually pip install, when the fix needs a newer dependency),
# regenerate both lockfiles on its branch with the README commands (Dependencies) but without
# --exclude-newer 14d, since the fix is usually younger than that, and check that both still
# have the fixed version. Major upgrades are done by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
