# Monthly, one grouped pull request per ecosystem. A release must be two weeks old first.
# Security updates come separately, as soon as an advisory is published.
version: 2
updates:
  # Bumps the exact pins in requirements*.txt; regenerate the lockfiles in the same pull
  # request (README, Dependencies), or tests/test_requirements.py fails.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns: ["*"]

  # CI runs Python 3.12, so the image only takes patch releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
