name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The Kaggle CSVs are not in the repo, so the tests use tests/fixtures/dataset/.
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 takes file patterns, not a directory, for --test.
      - run: node --test "tests/js/*.test.mjs"
