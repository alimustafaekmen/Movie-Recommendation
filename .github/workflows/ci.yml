name: CI

on: [push, pull_request]

permissions:
  contents: read

# Actions are pinned to a commit, so a moved tag cannot change what runs.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock.txt
      - run: pip install --require-hashes -r requirements-dev.lock.txt
      - run: ruff check .
      - run: ruff format --check .
      # Runs on tests/fixtures/dataset/; fails below the coverage in pyproject.toml.
      - run: pytest -q --cov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test "tests/js/*.test.mjs"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t movierec .
      # The fixture dataset stands in for the Kaggle CSVs; flags match docker-compose.yml.
      - run: >-
          docker run -d --name movierec -p 5001:5001
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD/tests/fixtures/dataset:/data:ro" -e DATASET_DIR=/data movierec
      - name: The app answers as the unprivileged user
        run: |
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:5001/health; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:5001/
          curl -fsS -o /dev/null http://127.0.0.1:5001/movie/155
          test "$(docker exec movierec id -un)" = appuser
      - if: always()
        run: docker logs movierec
