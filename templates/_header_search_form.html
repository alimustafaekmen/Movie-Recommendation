{% from "_icon.html" import icon -%}
<form method="POST" action="{{ url_for('movies.header_search') }}" class="header-search-form">
    <input type="search" name="search_query" placeholder="{{ t('header.search_placeholder') }}"
        aria-label="{{ t('header.search_label') }}" list="movie-titles"
        autocomplete="off" required>
    {# Shared with the home page's film field; base.js fills it on first focus. #}
    <datalist id="movie-titles" data-src="{{ url_for('movies.api_titles') }}"></datalist>
    <button type="submit" aria-label="{{ t('header.search_button') }}">{{ icon('magnifying-glass') }}</button>
</form>
