{% extends "base.html" %}

{% block title %}Hata Oluştu{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container card-style">
        <i class="fas fa-exclamation-triangle error-icon" aria-hidden="true"></i>
        {% if code %}<p class="error-code">{{ code }}</p>{% endif %}
        <h1>Bir Sorun Oluştu</h1>
        <p class="error-page-message">{{ message | default('Beklenmedik bir hata oluştu. Lütfen daha sonra tekrar deneyin.') }}</p>
        <a href="{{ url_for('movies.home') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Ana Sayfaya Dön
        </a>
    </div>
</div>
{% endblock %}
