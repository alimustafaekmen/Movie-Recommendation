[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "real_dataset: needs the full Kaggle TMDB 5000 CSVs in dataset/",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["screenshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]
