[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "real_dataset: needs the full Kaggle TMDB 5000 CSVs in dataset/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]

[tool.coverage.run]
source = ["movierec", "app"]
branch = true

[tool.coverage.report]
# The fixture-dataset number (CI has no Kaggle CSVs), rounded down, minus 1.
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
show_missing = true
