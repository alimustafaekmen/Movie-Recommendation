[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "real_dataset: needs the full Kaggle TMDB 5000 CSVs in dataset/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
# ruff format wraps code; the long lines left are strings and URLs it cannot split.
ignore = ["E501"]

[tool.coverage.run]
source = ["movierec", "app"]
branch = true

[tool.coverage.report]
# Line and branch coverage of the fixture-dataset run (CI has no Kaggle CSVs), rounded down,
# minus 1.
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
show_missing = true
