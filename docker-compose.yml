name: movierec

services:
  web:
    build: .
    container_name: movierec
    restart: unless-stopped
    # Local only. See README (Limitations) before exposing it.
    ports:
      - "127.0.0.1:5001:5001"
    # Optional: without it there is no TMDb data and a random session key.
    env_file:
      - path: .env
        required: false
    # The app writes no files; /tmp is for gunicorn's worker heartbeat.
    read_only: true
    tmpfs:
      - /tmp
    # A non-root server on port 5001 needs no capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
